name: CD
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install build tools for native modules
        run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Build Docker image
        run: docker build -t podcast-platform .

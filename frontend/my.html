<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的播客 - PodWave</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav"><div class="nav-inner"><a href="/" class="nav-brand">🎙 PodWave</a><div class="nav-links" id="navLinks"></div></div></nav>

  <div class="container">
    <h2 style="margin-bottom:20px;">我的播客</h2>
    <div id="myFeed"></div>
    <div id="pagination" style="text-align:center;padding:16px 0;"></div>
    <div id="emptyState" class="card" style="text-align:center;padding:40px;display:none;">
      <p style="font-size:18px;color:var(--text-secondary);">你还没有发布过播客</p>
      <a href="/publish.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex;">发布第一个</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (!isLoggedIn()) { location.href = "/login.html?redirect=" + encodeURIComponent(location.pathname); }
    renderNav("navLinks");
    showLoading("myFeed");

    async function loadMyPodcasts(page) {
      page = page || 1;
      try {
        const data = await api(`/api/podcasts/my?page=${page}&limit=10`);
        const feed = document.getElementById("myFeed");
        const empty = document.getElementById("emptyState");

        if (data.rows.length === 0 && page === 1) {
          empty.style.display = "block";
          feed.innerHTML = "";
          document.getElementById("pagination").innerHTML = "";
          return;
        }

        feed.innerHTML = data.rows.map(p => {
          const statusBadge = p.status === "approved"
            ? '<span class="badge badge-approved">已通过</span>'
            : p.status === "pending"
              ? '<span class="badge badge-pending">审核中</span>'
              : '<span class="badge badge-rejected">已拒绝</span>';
          const mimeType = getAudioType(p.audio_path);
          return `
            <div class="card podcast-card">
              <div class="podcast-header">
                <div style="flex:1;">
                  <div class="podcast-title">${escapeHtml(p.title)} ${statusBadge}</div>
                  <div class="podcast-time">${formatTime(p.created_at)} · ${p.plays || 0} 次播放</div>
                </div>
                <button class="btn btn-sm btn-danger" onclick="deletePodcast(${p.id})">删除</button>
              </div>
              ${p.description ? `<div class="podcast-desc">${escapeHtml(p.description)}</div>` : ""}
              <audio controls class="podcast-audio" preload="metadata">
                <source src="${p.audio_path}" type="${mimeType}">
              </audio>
              <div style="font-size:14px;color:var(--text-secondary);">♡ ${p.like_count || 0} · 💬 ${p.comment_count || 0}</div>
            </div>`;
        }).join("");

        renderPagination("pagination", data, "loadMyPodcasts");
      } catch (err) {
        document.getElementById("myFeed").innerHTML =
          `<div class="card"><p style="color:var(--danger);">加载失败：${escapeHtml(err.message)}</p></div>`;
      }
    }

    async function deletePodcast(id) {
      if (!confirm("确定要删除这个播客吗？")) return;
      try {
        await api(`/api/podcasts/${id}`, { method: "DELETE" });
        loadMyPodcasts(1);
      } catch (err) { alert(err.message); }
    }

    loadMyPodcasts(1);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>热门排行 - PodWave</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav"><div class="nav-inner"><a href="/" class="nav-brand">🎙 PodWave</a><div class="nav-links" id="navLinks"></div></div></nav>

  <div class="container">
    <h2 style="margin-bottom:20px;">🔥 热门排行榜</h2>
    <div id="hotList"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    renderNav("navLinks");
    showLoading("hotList");

    async function loadHot() {
      try {
        const opts = {};
        if (isLoggedIn()) opts.headers = { Authorization: `Bearer ${getToken()}` };
        const res = await fetch("/api/podcasts/hot", opts);
        const podcasts = await res.json();
        if (!res.ok) throw new Error(podcasts.error);

        const list = document.getElementById("hotList");
        if (podcasts.length === 0) {
          list.innerHTML = '<div class="card" style="text-align:center;padding:40px;color:var(--text-secondary);">暂无数据</div>';
          return;
        }

        list.innerHTML = podcasts.map((p, i) => {
          const initial = (p.username || "?")[0].toUpperCase();
          const mimeType = getAudioType(p.audio_path);
          const rankColors = ["#ff6b35", "#ff9a56", "#ffc185"];
          const rankColor = i < 3 ? rankColors[i] : "var(--text-secondary)";
          return `
            <div class="card podcast-card">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                <span style="font-size:24px;font-weight:900;color:${rankColor};min-width:36px;text-align:center;">${i + 1}</span>
                <a href="/user.html?id=${p.user_id}" style="text-decoration:none;display:flex;align-items:center;gap:10px;flex:1;">
                  <div class="podcast-avatar">${initial}</div>
                  <div>
                    <div class="podcast-author">${escapeHtml(p.username)}</div>
                    <div class="podcast-time">${formatTime(p.created_at)}</div>
                  </div>
                </a>
              </div>
              <a href="/detail.html?id=${p.id}" style="text-decoration:none;color:inherit;">
                <div class="podcast-title">${escapeHtml(p.title)}</div>
              </a>
              ${p.description ? `<div class="podcast-desc">${escapeHtml(p.description)}</div>` : ""}
              ${renderCoverImage(p)}
              <audio controls class="podcast-audio" preload="none">
                <source src="${p.audio_path}" type="${mimeType}">
              </audio>
              <div class="podcast-actions">${renderPodcastActions(p)}</div>
              <div style="font-size:13px;color:var(--text-secondary);margin-top:8px;">
                ▶ ${p.plays || 0} 播放 · ♡ ${p.like_count || 0} 赞
              </div>
            </div>`;
        }).join("");
      } catch (err) {
        document.getElementById("hotList").innerHTML =
          `<div class="card"><p style="color:var(--danger);">${escapeHtml(err.message)}</p></div>`;
      }
    }

    loadHot();
  </script>
</body>
</html>

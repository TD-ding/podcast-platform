<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 播客平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav"><div class="nav-inner"><a href="/" class="nav-brand">🎙 PodWave</a><div class="nav-links" id="navLinks"></div></div></nav>

  <div class="auth-page">
    <div class="card">
      <h2>注册</h2>
      <div id="error" class="error-msg"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" class="form-input" placeholder="2-20 个字符" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" class="form-input" placeholder="至少 6 位" required>
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="password2" class="form-input" placeholder="再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">注册</button>
      </form>
      <div class="auth-toggle">
        已有账号？<a href="/login.html">去登录</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (isLoggedIn()) { location.href = "/"; }
    renderNav("navLinks");

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      if (password !== password2) {
        errorEl.textContent = "两次密码不一致";
        errorEl.style.display = "block";
        return;
      }
      try {
        const data = await api("/api/auth/register", { method: "POST", body: { username, password } });
        setUser(data.token, data.user);
        location.href = "/";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知 - PodWave</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav"><div class="nav-inner"><a href="/" class="nav-brand">🎙 PodWave</a><div class="nav-links" id="navLinks"></div></div></nav>

  <div class="container" style="max-width:700px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <h2>通知</h2>
      <button class="btn btn-sm btn-outline" onclick="markAllRead()">全部已读</button>
    </div>
    <div id="notif-list"></div>
    <div id="pagination" style="text-align:center;padding:16px 0;"></div>
    <div id="emptyState" class="card" style="text-align:center;padding:40px;display:none;">
      <p style="font-size:18px;color:var(--text-secondary);">暂无通知 🔔</p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (!isLoggedIn()) { location.href = "/login.html?redirect=" + encodeURIComponent(location.pathname); }
    renderNav("navLinks");
    showLoading("notif-list");

    let currentPage = 1;

    async function loadNotifications(page) {
      currentPage = page || 1;
      try {
        const data = await api(`/api/notifications?page=${currentPage}&limit=20`);
        const list = document.getElementById("notif-list");
        const empty = document.getElementById("emptyState");

        if (data.rows.length === 0 && currentPage === 1) {
          empty.style.display = "block";
          list.innerHTML = "";
          document.getElementById("pagination").innerHTML = "";
          return;
        }

        const icons = { like: "♡", comment: "💬", review: "📋" };
        list.innerHTML = data.rows.map(n => {
          const icon = icons[n.type] || "🔔";
          const unread = !n.is_read ? 'style="background:#fff8f5;"' : "";
          const link = n.link ? `onclick="location.href='${n.link}'"` : "";
          return `
            <div class="card" ${unread} ${link} style="cursor:${n.link ? 'pointer' : 'default'};margin-bottom:8px;padding:14px 16px;">
              <div style="display:flex;align-items:flex-start;gap:12px;">
                <span style="font-size:20px;">${icon}</span>
                <div style="flex:1;">
                  <div style="font-weight:600;font-size:14px;">${escapeHtml(n.title)}</div>
                  <div style="font-size:14px;color:#666;margin-top:2px;">${escapeHtml(n.content)}</div>
                  <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${formatTime(n.created_at)}</div>
                </div>
                ${!n.is_read ? '<div style="width:8px;height:8px;background:var(--primary);border-radius:50%;margin-top:6px;flex-shrink:0;"></div>' : ''}
              </div>
            </div>`;
        }).join("");

        renderPagination("pagination", data, "loadNotifications");
      } catch (err) {
        document.getElementById("notif-list").innerHTML =
          `<div class="card"><p style="color:var(--danger);">${escapeHtml(err.message)}</p></div>`;
      }
    }

    async function markAllRead() {
      try {
        await api("/api/notifications/read-all", { method: "PUT" });
        loadNotifications(currentPage);
        loadNotifBadge();
      } catch (err) { alert(err.message); }
    }

    loadNotifications(1);
  </script>
</body>
</html>

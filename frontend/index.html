<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PodWave - 播客平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav"><div class="nav-inner"><a href="/" class="nav-brand">🎙 PodWave</a><div class="nav-links" id="navLinks"></div></div></nav>

  <div class="container">
    <div style="display:flex;gap:12px;margin-bottom:20px;">
      <input type="text" id="searchInput" class="form-input" placeholder="搜索播客标题..." style="flex:1;">
      <button class="btn btn-primary" onclick="searchPodcasts()">搜索</button>
    </div>
    <div id="feed"></div>
    <div id="pagination" style="text-align:center;padding:16px 0;"></div>
    <div id="emptyState" class="card" style="text-align:center;padding:40px;display:none;">
      <p id="emptyText" style="font-size:18px;color:var(--text-secondary);">还没有播客，快去发布第一个吧！🎙</p>
      <a href="/publish.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex;">发布播客</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let currentPage = 1;
    let currentKeyword = "";

    renderNav("navLinks");
    showLoading("feed");

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchPodcasts();
    });

    function searchPodcasts() {
      currentKeyword = document.getElementById("searchInput").value.trim();
      loadFeed(1);
    }

    async function loadFeed(page) {
      currentPage = page || 1;
      try {
        let url = `/api/podcasts?page=${currentPage}&limit=10`;
        if (currentKeyword) url += `&keyword=${encodeURIComponent(currentKeyword)}`;

        const opts = {};
        if (isLoggedIn()) opts.headers = { Authorization: `Bearer ${getToken()}` };
        const res = await fetch(url, opts);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        const feed = document.getElementById("feed");
        const empty = document.getElementById("emptyState");

        if (data.rows.length === 0 && currentPage === 1) {
          empty.style.display = "block";
          document.getElementById("emptyText").textContent = currentKeyword ? `没有找到与"${currentKeyword}"相关的播客` : "还没有播客，快去发布第一个吧！🎙";
          feed.innerHTML = "";
          document.getElementById("pagination").innerHTML = "";
          return;
        }

        feed.innerHTML = data.rows.map(p => renderPodcastCard(p)).join("");
        renderPagination("pagination", data, "loadFeed");
      } catch (err) {
        document.getElementById("feed").innerHTML =
          `<div class="card"><p style="color:var(--danger);">加载失败：${escapeHtml(err.message)}</p></div>`;
      }
    }

    function renderPodcastCard(p) {
      const initial = (p.username || "?")[0].toUpperCase();
      const mimeType = getAudioType(p.audio_path);
      const likedClass = p.liked ? "liked" : "";
      const likedSymbol = p.liked ? "♥" : "♡";
      return `
        <div class="card podcast-card" data-id="${p.id}">
          <div class="podcast-header">
            <a href="/user.html?id=${p.user_id}" style="text-decoration:none;display:flex;align-items:center;gap:12px;">
              <div class="podcast-avatar">${initial}</div>
              <div class="podcast-meta">
                <div class="podcast-author">${escapeHtml(p.username)}</div>
                <div class="podcast-time">${formatTime(p.created_at)}</div>
              </div>
            </a>
          </div>
          <a href="/detail.html?id=${p.id}" style="text-decoration:none;color:inherit;">
            <div class="podcast-title">${escapeHtml(p.title)}</div>
          </a>
          ${p.description ? `<div class="podcast-desc">${escapeHtml(p.description)}</div>` : ""}
          <audio controls class="podcast-audio" preload="none">
            <source src="${p.audio_path}" type="${mimeType}">
          </audio>
          <div class="podcast-actions">
            <button class="podcast-action ${likedClass}" id="like-btn-${p.id}" onclick="toggleLike(${p.id})">
              ${likedSymbol} <span id="like-count-${p.id}">${p.like_count || 0}</span>
            </button>
            <a href="/detail.html?id=${p.id}" class="podcast-action" style="text-decoration:none;">
              💬 <span id="comment-count-${p.id}">${p.comment_count || 0}</span>
            </a>
          </div>
        </div>`;
    }

    async function toggleLike(podcastId) {
      if (!isLoggedIn()) { location.href = "/login.html?redirect=" + encodeURIComponent(location.pathname); return; }
      try {
        const result = await api(`/api/podcasts/${podcastId}/like`, { method: "POST" });
        const btn = document.getElementById(`like-btn-${podcastId}`);
        const count = document.getElementById(`like-count-${podcastId}`);
        btn.classList.toggle("liked", result.liked);
        btn.childNodes[0].textContent = result.liked ? "♥ " : "♡ ";
        count.textContent = result.liked ? parseInt(count.textContent) + 1 : parseInt(count.textContent) - 1;
      } catch (_e) { /* ignore */ }
    }

    loadFeed(1);
  </script>
</body>
</html>
